stimuli:
  instruction:
    type: text
    font: SimHei
    text: '运动后效任务


      请一直看中央十字，保持头部、距离和窗口大小不变。

      每次四个条纹移动30秒，随后条纹会真正停止。


      停止后，图案可能仍显得在动，也可能没有运动感：

      若有运动感，等这种感觉完全消失时按空格。

      若从停止的一开始就没有运动感，请按 N。

      请按实际感觉报告，不要预先按键或等待固定时间。


      每次最多等30秒作答，之后注视十字休息60秒。

      共两组，每组4次；组间可自行休息。

      本任务未做屏幕标定，不提供能力或临床评分。

      准备好后按空格。'
    color: '#141414'
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  fixation:
    type: text
    font: SimHei
    text: +
    color: '#141414'
    height: 12
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  block_break:
    type: text
    font: SimHei
    text: '本组完成，可以休息。


      请保持显示设置和观察距离不变。

      准备好后按空格继续。'
    color: '#141414'
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  good_bye:
    type: text
    font: SimHei
    text: '任务完成，谢谢参与。


      按空格结束并保存数据。'
    color: '#141414'
    height: 24
    wrapWidth: 1100
    pos:
    - 0
    - 0
    units: pix
  patch_0:
    type: grating
    tex: sin
    mask: gauss
    size:
    - 256
    - 256
    sf: 0.03125
    phase:
    - 0
    - 0
    contrast: 0.4
    maskParams:
      sd: 5
    texRes: 1024
    pos:
